name: Build Debug APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Unzip any ZIP file found
      run: |
        # پیدا کردن هر فایل زیپی که در روت مخزن باشد
        ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" | head -n 1)
        if [ -n "$ZIP_FILE" ]; then
          echo "Found zip file: $ZIP_FILE"
          unzip "$ZIP_FILE"
        else
          echo "No zip file found. Assuming files are already extracted."
        fi

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Gradle 8.10
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.10.2' # نسخه ارتقا یافته برای حل مشکل AGP 8.7.3

    - name: Generate Wrapper and Build APK
      run: |
        # پیدا کردن مسیر اصلی پروژه (جایی که فایل settings.gradle قرار دارد)
        PROJECT_DIR=$(find . -name "settings.gradle*" -exec dirname {} \; | head -n 1)
        if [ -z "$PROJECT_DIR" ]; then
          echo "Error: Could not find settings.gradle. Make sure project files are uploaded correctly."
          exit 1
        fi
        echo "Project root found at: $PROJECT_DIR"
        cd "$PROJECT_DIR"

        # اگر فایل gradlew وجود نداشت، خودش می‌سازد
        if [ ! -f "gradlew" ]; then
          echo "gradlew not found. Generating it..."
          gradle wrapper
        fi

        # دادن دسترسی اجرا و شروع بیلد
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: SalawatCounter-APK
        # این مسیر **/ باعث می‌شود فایل APK در هر زیرپوشه‌ای که باشد پیدا شود
        path: "**/build/outputs/apk/debug/app-debug.apk"
