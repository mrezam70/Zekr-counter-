name: Build Debug APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Unzip project file
      run: unzip ZkrApp-step5.zip

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.7'

    - name: Generate Gradle Wrapper
      run: gradle wrapper
      working-directory: ./ZkrApp-step5

    - name: Grant execute permission
      run: chmod +x gradlew
      working-directory: ./ZkrApp-step5

    - name: Build Debug APK
      run: ./gradlew assembleDebug
      working-directory: ./ZkrApp-step5

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: SalawatCounter-APK
        path: ZkrApp-step5/app/build/outputs/apk/debug/app-debug.apk
