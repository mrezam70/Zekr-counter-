name: Build Debug APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Debug - Show files
      run: |
        echo "=== Root Directory Files ==="
        ls -la

    - name: Unzip if zip exists
      run: |
        ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" | head -n 1)
        if [ -n "$ZIP_FILE" ]; then
          echo "Found zip file: $ZIP_FILE"
          unzip "$ZIP_FILE"
        else
          echo "No zip file found. Assuming files are already extracted."
        fi

    - name: Debug - Show files after unzip
      run: |
        echo "=== Files After Unzip ==="
        ls -la

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.7'

    - name: Find Gradle Project Directory
      id: find_gradle
      run: |
        if [ -f "gradlew" ]; then
          echo "dir=." >> $GITHUB_OUTPUT
        elif [ -d "ZkrApp-step5" ] && [ -f "ZkrApp-step5/gradlew" ]; then
          echo "dir=ZkrApp-step5" >> $GITHUB_OUTPUT
        else
          if [ -d "ZkrApp-step5" ]; then
            cd ZkrApp-step5
            echo "dir=ZkrApp-step5" >> $GITHUB_OUTPUT
          else
            echo "dir=." >> $GITHUB_OUTPUT
          fi
          gradle wrapper
        fi

    - name: Build Debug APK
      run: |
        cd ${{ steps.find_gradle.outputs.dir }}
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: SalawatCounter-APK
        path: "**/app/build/outputs/apk/debug/app-debug.apk"
